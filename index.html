<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
/* ============================================================
   1. TOKENS
   ============================================================ */
:root {
  /* Paper + blush */
  --cream: #fff8f4;
  --cream-deep: #fff0f1;
  --blush: #ffdde4;
  --blush-soft: #fff3f4;
  --paper: #fffdfb;

  /* Rose */
  --rose: #e2556f;
  --rose-deep: #c93f5b;
  --rose-soft: #f7a8b6;

  /* Ink */
  --wine: #43172a;
  --wine-soft: #6d3346;
  --ink-muted: rgba(67, 23, 42, 0.6);
  --ink-faint: rgba(67, 23, 42, 0.38);

  /* Gold */
  --gold: #c8a96a;
  --gold-deep: #a8863f;

  /* Lines & shadows */
  --hairline: rgba(200, 169, 106, 0.4);
  --hairline-strong: rgba(200, 169, 106, 0.62);
  --shadow-card:
    0 2px 4px rgba(90, 30, 45, 0.04),
    0 18px 40px -18px rgba(140, 60, 80, 0.28),
    0 48px 90px -48px rgba(120, 45, 65, 0.4);
  --shadow-rose: 0 14px 30px -12px rgba(201, 63, 91, 0.55);

  /* Type */
  --serif: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --sans: "Jost", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

  /* Motion */
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-spring: cubic-bezier(0.34, 1.4, 0.5, 1);
}

/* ============================================================
   2. RESET & BASE
   ============================================================ */
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  min-height: 100%;
}

body {
  font-family: var(--sans);
  color: var(--wine);
  background: var(--cream);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

button {
  font: inherit;
  color: inherit;
}

/* ============================================================
   3. BACKGROUND LAYERS
   ============================================================ */
.bg-base {
  position: fixed;
  inset: 0;
  z-index: 0;
  background:
    radial-gradient(85% 60% at 50% -12%, rgba(255, 255, 255, 0.95), transparent 58%),
    radial-gradient(70% 55% at 8% 4%, rgba(255, 221, 228, 0.95), transparent 60%),
    radial-gradient(65% 60% at 96% 12%, rgba(255, 236, 222, 0.9), transparent 64%),
    radial-gradient(80% 70% at 50% 108%, rgba(255, 214, 224, 0.85), transparent 62%),
    linear-gradient(168deg, #fff8f4 0%, #fff1f2 46%, #ffe7ea 100%);
  background-attachment: fixed;
}

/* Slow warm blooms drifting behind the card */
.bg-bloom {
  position: fixed;
  inset: -12%;
  z-index: 1;
  pointer-events: none;
  background:
    radial-gradient(34vmax 34vmax at 22% 24%, rgba(255, 176, 190, 0.34), transparent 62%),
    radial-gradient(30vmax 30vmax at 80% 74%, rgba(226, 190, 140, 0.26), transparent 64%),
    radial-gradient(26vmax 26vmax at 68% 12%, rgba(255, 255, 255, 0.5), transparent 66%);
  animation: bloomDrift 34s ease-in-out infinite alternate;
}

@keyframes bloomDrift {
  from { transform: translate3d(0, 0, 0) scale(1); }
  to   { transform: translate3d(1.5%, -1.5%, 0) scale(1.08); }
}

/* Fine paper grain */
.bg-grain {
  position: fixed;
  inset: 0;
  z-index: 2;
  width: 100%;
  height: 100%;
  pointer-events: none;
  opacity: 0.5;
  mix-blend-mode: multiply;
}

/* Warm vignette so the card sits in light */
.bg-vignette {
  position: fixed;
  inset: 0;
  z-index: 3;
  pointer-events: none;
  background: radial-gradient(125vmax 125vmax at 50% 46%, transparent 46%, rgba(160, 92, 100, 0.16) 100%);
}

/* ============================================================
   4. AMBIENT HEARTS (before "Yes")
   ============================================================ */
.ambient-hearts {
  position: fixed;
  inset: 0;
  z-index: 4;
  pointer-events: none;
  overflow: hidden;
}

.ambient-heart {
  position: absolute;
  bottom: -12vh;
  animation-name: ambientFloat;
  animation-timing-function: linear;
  animation-iteration-count: infinite;
  will-change: transform, opacity;
}

.ambient-heart svg {
  display: block;
  width: 100%;
  height: 100%;
}

@keyframes ambientFloat {
  0% {
    transform: translate3d(0, 0, 0) rotate(0deg) scale(0.75);
    opacity: 0;
  }
  14% { opacity: var(--peak-opacity, 0.5); }
  76% { opacity: var(--peak-opacity, 0.5); }
  100% {
    transform: translate3d(var(--drift, 40px), -118vh, 0) rotate(var(--spin, 16deg)) scale(1);
    opacity: 0;
  }
}

/* ============================================================
   5. STAGE
   ============================================================ */
.stage {
  position: relative;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  min-height: 100dvh;
  padding: 28px 20px calc(28px + env(safe-area-inset-bottom));
}
/* ============================================================
   6. CARD
   ============================================================ */
.card {
  position: relative;
  width: 100%;
  max-width: 540px;
  padding: clamp(34px, 6.4vw, 58px) clamp(24px, 6vw, 54px) clamp(30px, 5.4vw, 50px);
  text-align: center;
  border-radius: 26px;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.92) 0%, rgba(255, 250, 249, 0.86) 100%),
    var(--paper);
  border: 1px solid var(--hairline);
  box-shadow: var(--shadow-card);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  /* "backwards", not "both": a forwards fill would keep the entrance
     keyframe's opacity/transform applied forever and outrank
     .is-leaving, leaving the dismissed card painted on screen. */
  animation: cardIn 1s var(--ease-spring) backwards;
  transition: opacity 0.65s var(--ease-out), transform 0.65s var(--ease-out), filter 0.65s var(--ease-out);
}

/* Inner gold hairline — the "engraved" frame */
.card::before {
  content: "";
  position: absolute;
  inset: 9px;
  border-radius: 19px;
  border: 1px solid rgba(200, 169, 106, 0.26);
  pointer-events: none;
}

@keyframes cardIn {
  0%   { opacity: 0; transform: translateY(26px) scale(0.965); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

.card.is-leaving {
  opacity: 0;
  transform: translateY(-22px) scale(0.96);
  filter: blur(6px);
  pointer-events: none;
}

/* ============================================================
   7. CARD CONTENT
   ============================================================ */

/* Small ornament: hairline — heart — hairline */
.ornament {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-bottom: clamp(16px, 3vw, 22px);
  color: var(--gold-deep);
}

.ornament::before,
.ornament::after {
  content: "";
  width: clamp(28px, 9vw, 54px);
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--hairline-strong));
}

.ornament::after {
  background: linear-gradient(90deg, var(--hairline-strong), transparent);
}

.ornament svg {
  width: 13px;
  height: 12px;
  display: block;
}

.eyebrow {
  display: block;
  font-family: var(--sans);
  font-size: clamp(0.66rem, 2.4vw, 0.74rem);
  font-weight: 500;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--gold-deep);
  margin-bottom: clamp(14px, 2.6vw, 18px);
}

.title {
  font-family: var(--serif);
  font-size: clamp(2rem, 7.4vw, 3.15rem);
  line-height: 1.1;
  font-weight: 500;
  letter-spacing: -0.015em;
  color: var(--wine);
}

.title .title-nowrap {
  display: inline-block;
  white-space: nowrap;
}

.title .title-accent {
  display: inline-block;
  font-style: italic;
  font-weight: 500;
  color: var(--rose-deep);
}

.title .title-heart {
  display: inline-block;
  width: 0.52em;
  height: 0.48em;
  margin-left: 0.22em;
  vertical-align: 0.1em;
  color: var(--rose);
  animation: heartBeat 2.6s var(--ease-out) infinite;
}

.title .title-heart svg {
  display: block;
  width: 100%;
  height: 100%;
}

@keyframes heartBeat {
  0%, 100% { transform: scale(1); }
  12%      { transform: scale(1.16); }
  26%      { transform: scale(1); }
  38%      { transform: scale(1.1); }
  52%      { transform: scale(1); }
}

.subtitle {
  margin: clamp(14px, 2.8vw, 20px) auto 0;
  max-width: 34ch;
  font-family: var(--sans);
  font-size: clamp(0.92rem, 3.4vw, 1.02rem);
  font-weight: 300;
  line-height: 1.72;
  color: var(--ink-muted);
  text-wrap: pretty;
}

/* ============================================================
   8. ACTIONS
   ============================================================ */
.actions {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: clamp(12px, 3vw, 16px);
  margin-top: clamp(26px, 5vw, 36px);
  min-height: 56px;
}

.btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  padding: 15px 32px;
  font-family: var(--sans);
  font-size: clamp(0.9rem, 3vw, 0.98rem);
  font-weight: 500;
  letter-spacing: 0.02em;
  line-height: 1;
  border: 1px solid transparent;
  border-radius: 999px;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
  transition:
    transform 0.24s var(--ease-spring),
    box-shadow 0.3s var(--ease-out),
    background-color 0.3s var(--ease-out),
    border-color 0.3s var(--ease-out),
    color 0.3s var(--ease-out),
    font-size 0.3s var(--ease-out);
}

/* --- Yes --- */
.btn-yes {
  color: #fffaf8;
  background: linear-gradient(135deg, #e66477 0%, var(--rose) 42%, var(--rose-deep) 100%);
  box-shadow: var(--shadow-rose), 0 0 0 1px rgba(255, 255, 255, 0.22) inset;
}

.btn-yes .btn-icon {
  width: 15px;
  height: 14px;
  flex: none;
}

.btn-yes .btn-icon svg {
  display: block;
  width: 100%;
  height: 100%;
}

.btn-yes:hover {
  transform: translateY(-2px);
  box-shadow: 0 20px 38px -14px rgba(201, 63, 91, 0.68), 0 0 0 1px rgba(255, 255, 255, 0.32) inset;
}

.btn-yes:active {
  transform: translateY(1px) scale(0.985);
}

.btn-yes:focus-visible {
  outline: 2px solid var(--wine);
  outline-offset: 4px;
}

.btn-yes.is-grown {
  font-size: calc(clamp(0.9rem, 3vw, 0.98rem) * var(--yes-scale, 1));
  box-shadow: 0 22px 44px -14px rgba(201, 63, 91, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.32) inset;
}

/* --- No (flees) --- */
.btn-no {
  color: var(--wine-soft);
  background: rgba(255, 255, 255, 0.6);
  border-color: rgba(67, 23, 42, 0.16);
  box-shadow: 0 6px 14px -10px rgba(67, 23, 42, 0.5);
  will-change: transform, left, top;
}

.btn-no:hover {
  background: rgba(255, 255, 255, 0.85);
  border-color: rgba(67, 23, 42, 0.26);
}

.btn-no.is-fleeing {
  position: fixed;
  margin: 0;
  left: 0;
  top: 0;
  z-index: 45;
  background: rgba(255, 253, 251, 0.94);
  box-shadow: 0 14px 30px -14px rgba(67, 23, 42, 0.5);
  transition: transform 0.34s var(--ease-out), background-color 0.25s ease, box-shadow 0.25s ease;
}


/* ============================================================
   9. FUNNY MESSAGE TOAST
   ============================================================ */
.toast {
  position: fixed;
  z-index: 60;
  left: 50%;
  top: 20px;
  transform: translate(-50%, -14px) scale(0.94);
  padding: 11px 22px;
  max-width: min(92vw, 420px);
  font-family: var(--sans);
  font-size: clamp(0.82rem, 3vw, 0.9rem);
  font-weight: 400;
  letter-spacing: 0.01em;
  line-height: 1.4;
  text-align: center;
  color: var(--wine);
  border-radius: 999px;
  background: rgba(255, 253, 251, 0.96);
  border: 1px solid var(--hairline);
  box-shadow: 0 12px 30px -14px rgba(120, 45, 65, 0.45);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.26s ease, transform 0.4s var(--ease-spring);
}

.toast.is-visible {
  opacity: 1;
  transform: translate(-50%, 0) scale(1);
}

/* ============================================================
   10. HEARTS SCENE (after "Yes")
   ============================================================ */
.hearts-scene {
  position: fixed;
  inset: 0;
  z-index: 20;
  pointer-events: none;
  overflow: hidden;
  opacity: 0;
  transition: opacity 0.7s ease;
}

.hearts-scene.is-active {
  opacity: 1;
}

.falling-heart {
  position: absolute;
  top: -14vh;
  will-change: transform, opacity;
  animation-name: heartFall;
  animation-timing-function: linear;
  animation-iteration-count: infinite;
}

.falling-heart svg {
  display: block;
  width: 100%;
  height: 100%;
}

@keyframes heartFall {
  0% {
    transform: translate3d(0, 0, 0) rotate(0deg) scale(var(--start-scale, 0.8));
    opacity: 0;
  }
  9%  { opacity: var(--heart-opacity, 0.9); }
  84% { opacity: var(--heart-opacity, 0.9); }
  100% {
    transform: translate3d(var(--sway, 60px), 124vh, 0) rotate(var(--spin, 200deg)) scale(1);
    opacity: 0;
  }
}

@keyframes heartRise {
  0% {
    transform: translate3d(0, 0, 0) rotate(0deg) scale(var(--start-scale, 0.6));
    opacity: 0;
  }
  11% { opacity: var(--heart-opacity, 0.75); }
  80% { opacity: var(--heart-opacity, 0.75); }
  100% {
    transform: translate3d(var(--sway, -50px), -124vh, 0) rotate(var(--spin, -160deg)) scale(1);
    opacity: 0;
  }
}

/* ============================================================
   11. FINAL MESSAGE
   ============================================================ */
.final-message {
  position: fixed;
  z-index: 30;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 28px 20px calc(28px + env(safe-area-inset-bottom));
  opacity: 0;
  transform: translateY(20px) scale(0.97);
  pointer-events: none;
  transition: opacity 0.9s var(--ease-out) 0.35s, transform 0.9s var(--ease-spring) 0.35s;
}

.final-message.is-visible {
  opacity: 1;
  transform: translateY(0) scale(1);
}

.final-card {
  position: relative;
  width: 100%;
  max-width: 580px;
  padding: clamp(38px, 7vw, 62px) clamp(26px, 6vw, 58px);
  text-align: center;
  border-radius: 28px;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.94) 0%, rgba(255, 249, 248, 0.88) 100%),
    var(--paper);
  border: 1px solid var(--hairline);
  box-shadow: var(--shadow-card);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.final-card::before {
  content: "";
  position: absolute;
  inset: 9px;
  border-radius: 21px;
  border: 1px solid rgba(200, 169, 106, 0.26);
  pointer-events: none;
}

.final-eyebrow {
  display: block;
  font-size: clamp(0.64rem, 2.3vw, 0.72rem);
  font-weight: 500;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--gold-deep);
  margin-bottom: clamp(14px, 2.6vw, 18px);
}

.final-title {
  font-family: var(--serif);
  font-size: clamp(1.6rem, 5.6vw, 2.35rem);
  line-height: 1.26;
  font-weight: 500;
  letter-spacing: -0.01em;
  color: var(--wine);
  text-wrap: pretty;
}

.final-title em {
  font-style: italic;
  color: var(--rose-deep);
}

.final-signature {
  margin-top: clamp(22px, 4vw, 30px);
  font-family: var(--serif);
  font-size: clamp(1.02rem, 3.4vw, 1.2rem);
  font-weight: 400;
  font-style: italic;
  letter-spacing: 0.01em;
  color: var(--wine-soft);
}

.final-signature strong {
  font-weight: 600;
  font-style: normal;
  color: var(--rose-deep);
}

/* Three dots of light under the message */
.final-hearts {
  margin-top: clamp(18px, 3.5vw, 26px);
  display: flex;
  justify-content: center;
  gap: 10px;
}

.final-hearts span {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--rose-soft);
  animation: dotPulse 1.8s ease-in-out infinite;
}

.final-hearts span:nth-child(2) { animation-delay: 0.22s; background: var(--rose); }
.final-hearts span:nth-child(3) { animation-delay: 0.44s; background: var(--gold); }

@keyframes dotPulse {
  0%, 100% { transform: scale(1); opacity: 0.5; }
  50%      { transform: scale(1.45); opacity: 1; }
}

/* ============================================================
   12. CONFETTI
   ============================================================ */
.confetti-layer {
  position: fixed;
  inset: 0;
  z-index: 50;
  pointer-events: none;
  overflow: hidden;
}

.confetti-piece {
  position: absolute;
  top: -6vh;
  will-change: transform, opacity;
  animation: confettiFall linear forwards;
}

@keyframes confettiFall {
  0% {
    transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
    opacity: 1;
  }
  100% {
    transform: translate3d(var(--confetti-x, 40px), 108vh, 0) rotate(var(--confetti-rot, 540deg)) scale(0.85);
    opacity: 0;
  }
}

/* ============================================================
   13. RESPONSIVE
   ============================================================ */
@media (max-width: 520px) {
  .stage {
    padding: 20px 15px calc(20px + env(safe-area-inset-bottom));
  }

  .card {
    border-radius: 22px;
    padding: 34px 22px 32px;
  }

  .card::before {
    inset: 7px;
    border-radius: 16px;
  }

  .btn {
    padding: 14px 28px;
  }

  .toast {
    top: 14px;
    padding: 10px 18px;
  }

  .final-card {
    border-radius: 24px;
  }

  .final-card::before {
    inset: 7px;
    border-radius: 18px;
  }
}

@media (max-width: 360px) {
  .btn {
    padding: 13px 22px;
  }

  .eyebrow {
    letter-spacing: 0.22em;
  }
}

/* ============================================================
   14. PREVIEW MODE (?preview=1)
   Only used to render the link-preview image: no grain (it
   bloats the PNG) and a bigger card in the 1200×630 frame.
   ============================================================ */
body.is-preview .bg-grain {
  display: none;
}

body.is-preview .card {
  max-width: 700px;
  padding: 52px 56px 48px;
}

body.is-preview .title {
  font-size: 3.4rem;
}

body.is-preview .subtitle {
  font-size: 1rem;
  max-width: 40ch;
}

body.is-preview .btn {
  padding: 16px 36px;
  font-size: 1rem;
}

/* ============================================================
   15. REDUCED MOTION
   ============================================================ */
@media (prefers-reduced-motion: reduce) {
  .bg-bloom,
  .ambient-heart,
  .title .title-heart,
  .final-hearts span {
    animation: none !important;
  }

  .falling-heart {
    animation-duration: calc(var(--heart-duration, 10s) * 2) !important;
  }

  .card,
  .final-message,
  .toast {
    transition-duration: 0.2s !important;
  }

  .card {
    animation-duration: 0.001s !important;
  }
}
</style>
</head>
<body>

<!-- Background -->
<div class="bg-base" aria-hidden="true"></div>
<div class="bg-bloom" aria-hidden="true"></div>
<svg class="bg-grain" aria-hidden="true">
  <filter id="paperGrain">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" />
    <feColorMatrix type="saturate" values="0" />
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.09" />
    </feComponentTransfer>
  </filter>
  <rect width="100%" height="100%" filter="url(#paperGrain)" />
</svg>
<div class="bg-vignette" aria-hidden="true"></div>

<!-- Soft ambient hearts -->
<div class="ambient-hearts" id="ambientHearts" aria-hidden="true"></div>

<!-- ============================================================
     THE QUESTION
     ============================================================ -->
<main class="stage">
  <section class="card" id="card">
    <div class="ornament" aria-hidden="true">
      <svg viewBox="0 0 32 29" xmlns="http://www.w3.org/2000/svg">
        <path fill="currentColor" d="M16 28.2S0 18.6 0 9.6C0 4.3 4.2 0 9.4 0c2.7 0 5.2 1.3 6.6 3.4C17.4 1.3 19.9 0 22.6 0 27.8 0 32 4.3 32 9.6c0 9-16 18.6-16 18.6z"/>
      </svg>
    </div>

    <span class="eyebrow" id="greeting">Just for you</span>

    <h1 class="title" id="title">
      Will you go out
      <span class="title-nowrap"><span class="title-accent">with me</span><span class="title-heart" aria-hidden="true"><svg viewBox="0 0 32 29" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="M16 28.2S0 18.6 0 9.6C0 4.3 4.2 0 9.4 0c2.7 0 5.2 1.3 6.6 3.4C17.4 1.3 19.9 0 22.6 0 27.8 0 32 4.3 32 9.6c0 9-16 18.6-16 18.6z"/></svg></span></span>
    </h1>

    <p class="subtitle" id="subtitle">
      Just one small question, and one very easy answer.
    </p>

    <div class="actions" id="actions">
      <button class="btn btn-yes" id="yesBtn" type="button">
        <span class="btn-icon" aria-hidden="true"><svg viewBox="0 0 32 29" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="M16 28.2S0 18.6 0 9.6C0 4.3 4.2 0 9.4 0c2.7 0 5.2 1.3 6.6 3.4C17.4 1.3 19.9 0 22.6 0 27.8 0 32 4.3 32 9.6c0 9-16 18.6-16 18.6z"/></svg></span>
        <span class="btn-label" id="yesLabel">Yes, I will</span>
      </button>
      <button class="btn btn-no" id="noBtn" type="button" aria-label="No">
        <span class="btn-label" id="noLabel">No</span>
      </button>
    </div>
  </section>
</main>

<!-- Celebration layers -->
<div class="hearts-scene" id="heartsScene" aria-hidden="true"></div>

<div class="final-message" id="finalMessage" role="status" aria-live="polite">
  <div class="final-card">
    <span class="final-eyebrow">It's a date</span>
    <h2 class="final-title" id="finalTitle">
      You just made my week. I'll pick something <em>lovely</em> for us.
    </h2>
    <p class="final-signature" id="finalSignature">
      with love, <strong id="signatureName">Adem</strong>
    </p>
    <div class="final-hearts" aria-hidden="true">
      <span></span><span></span><span></span>
    </div>
  </div>
</div>

<!-- Funny lines from the "No" button -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- Confetti -->
<div class="confetti-layer" id="confettiLayer" aria-hidden="true"></div>
<script>
/* ============================================================
   ✏️  EDIT ME
   ============================================================ */

const NAMES = {
  /** Her name — leave it as "" and the page stays nameless. */
  her: "",
  /** Your name — signs the final message. */
  me: "Adem"
};

const TEXTS = {
  greetingWithName: (name) => `Hey ${name}`,
  greetingAnonymous: "Just for you",
  yesLabel: "Yes, I will",
  noLabel: "No",
  signaturePrefix: "with love, ",
  /** Short lines the "No" button keeps saying. */
  funnyMessages: [
    "Nice try",
    "That one is out of order",
    "Wrong button, I think",
    "It keeps slipping away",
    "Are you sure?",
    "Try the other one",
    "Still no? Impressive",
    "I'll wait right here"
  ]
};

/* ============================================================
   ⚙️  BEHAVIOUR
   ============================================================ */

const CONFIG = {
  /** Distance (px) from the "No" button that makes it run on desktop. */
  fleeRadius: 72,
  /** Escapes before "Yes" stops growing. */
  maxYesGrowth: 5,
  /** Growth per escape. */
  yesGrowthStep: 0.055,
  /** Hard cap for the "Yes" scale. */
  maxYesScale: 1.32,
  /** 0..1 chance an escape also shows a line of text. */
  funnyMessageChance: 0.42,
  /** Minimum ms between messages. */
  funnyMessageCooldown: 1700,
  /** Ambient hearts before "Yes". */
  ambientHeartCount: 16,
  /** Hearts in the celebration scene. */
  sceneHeartCount: 44,
  /** Confetti pieces. */
  confettiCount: 80
};

/* ============================================================
   🧩  HELPERS
   ============================================================ */

const randomBetween = (min, max) => min + Math.random() * (max - min);
const randomInt = (min, max) => Math.floor(randomBetween(min, max + 1));
const pick = (list) => list[Math.floor(Math.random() * list.length)];
const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

/** Delicate palette: rose, blush, pearl, soft gold. */
const HEART_COLORS = [
  "#e2556f",
  "#c93f5b",
  "#f2889b",
  "#f7a8b6",
  "#ffd9e2",
  "#c8a96a",
  "#e8cf9a",
  "#fffdfb"
];

const CONFETTI_COLORS = [
  "#e2556f",
  "#c93f5b",
  "#f2889b",
  "#ffd9e2",
  "#c8a96a",
  "#e8cf9a",
  "#fffdfb"
];

const HEART_PATH = "M16 28.2S0 18.6 0 9.6C0 4.3 4.2 0 9.4 0c2.7 0 5.2 1.3 6.6 3.4C17.4 1.3 19.9 0 22.6 0 27.8 0 32 4.3 32 9.6c0 9-16 18.6-16 18.6z";

/** Inline SVG heart — crisp at any size, no external asset. */
function heartSVG(color) {
  return `<svg viewBox="0 0 32 29" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path fill="${color}" d="${HEART_PATH}"/></svg>`;
}

/* ============================================================
   🖼️  DOM
   ============================================================ */

const card = document.getElementById("card");
const greetingEl = document.getElementById("greeting");
const yesBtn = document.getElementById("yesBtn");
const yesLabelEl = document.getElementById("yesLabel");
const noBtn = document.getElementById("noBtn");
const noLabelEl = document.getElementById("noLabel");
const actions = document.getElementById("actions");
const ambientHeartsEl = document.getElementById("ambientHearts");
const heartsSceneEl = document.getElementById("heartsScene");
const finalMessageEl = document.getElementById("finalMessage");
const signatureNameEl = document.getElementById("signatureName");
const toastEl = document.getElementById("toast");
const confettiLayer = document.getElementById("confettiLayer");

/* ============================================================
   📝  TEXT
   ============================================================ */

function applyTexts() {
  const herName = NAMES.her.trim();
  greetingEl.textContent = herName
    ? TEXTS.greetingWithName(herName)
    : TEXTS.greetingAnonymous;

  yesLabelEl.textContent = TEXTS.yesLabel;
  noLabelEl.textContent = TEXTS.noLabel;
  noBtn.setAttribute("aria-label", TEXTS.noLabel);

  const myName = NAMES.me.trim();
  signatureNameEl.textContent = myName;
  signatureNameEl.hidden = myName.length === 0;
}

/* ============================================================
   🌸  AMBIENT HEARTS
   ============================================================ */

function createAmbientHearts() {
  const fragment = document.createDocumentFragment();

  for (let i = 0; i < CONFIG.ambientHeartCount; i++) {
    const heart = document.createElement("div");
    heart.className = "ambient-heart";

    const size = randomBetween(11, 26);
    const duration = randomBetween(15, 26);
    const delay = randomBetween(0, 24);

    heart.style.width = `${size}px`;
    heart.style.height = `${size * 0.9}px`;
    heart.style.left = `${randomBetween(2, 96)}%`;
    heart.style.animationDuration = `${duration}s`;
    heart.style.animationDelay = `-${delay}s`;
    heart.style.setProperty("--drift", `${randomBetween(-100, 100)}px`);
    heart.style.setProperty("--spin", `${randomBetween(-34, 34)}deg`);
    heart.style.setProperty("--peak-opacity", randomBetween(0.16, 0.4).toFixed(2));
    heart.innerHTML = heartSVG(pick(HEART_COLORS));

    fragment.appendChild(heart);
  }

  ambientHeartsEl.appendChild(fragment);
}
/* ============================================================
   🏃  THE FLEEING "NO"
   ============================================================ */

const fleeState = {
  active: false,
  escapeCount: 0,
  lastMessageAt: 0,
  rect: null
};

/** Gap (px) kept between the fleeing button and the "Yes" button. */
const NO_YES_GAP = 24;

let hasSaidYes = false;
let noBtnPlaceholder = null;
let lastFleeAt = 0;

function getYesRect() {
  return yesBtn.getBoundingClientRect();
}

/** Take the "No" button out of the card and pin it to the viewport. */
function detachNoButton() {
  if (fleeState.active) return;

  const rect = noBtn.getBoundingClientRect();
  fleeState.active = true;
  fleeState.rect = { left: rect.left, top: rect.top, width: rect.width, height: rect.height };

  // The card clips its children, so the button moves to <body> first.
  document.body.appendChild(noBtn);

  // Keep the layout stable once "No" leaves the row.
  noBtnPlaceholder = document.createElement("span");
  noBtnPlaceholder.setAttribute("aria-hidden", "true");
  noBtnPlaceholder.style.display = "inline-block";
  noBtnPlaceholder.style.width = `${rect.width}px`;
  noBtnPlaceholder.style.height = `${rect.height}px`;
  actions.appendChild(noBtnPlaceholder);

  noBtn.classList.add("is-fleeing");
  noBtn.style.width = `${rect.width}px`;
  noBtn.style.height = `${rect.height}px`;
  moveNoButtonTo(rect.left, rect.top, false);
}

function moveNoButtonTo(x, y, animate = true) {
  fleeState.rect.left = x;
  fleeState.rect.top = y;

  if (!animate) {
    const previousTransition = noBtn.style.transition;
    noBtn.style.transition = "none";
    noBtn.style.transform = `translate3d(${x}px, ${y}px, 0)`;
    void noBtn.offsetWidth;
    noBtn.style.transition = previousTransition || "";
    return;
  }

  noBtn.style.transform = `translate3d(${x}px, ${y}px, 0)`;
}

/** A random spot inside the viewport that stays clear of "Yes". */
function findFreeSpot() {
  const noW = fleeState.rect.width;
  const noH = fleeState.rect.height;
  const margin = 16;
  const maxX = Math.max(margin, window.innerWidth - noW - margin);
  const maxY = Math.max(margin, window.innerHeight - noH - margin);

  const yesRect = getYesRect();
  const current = fleeState.rect;

  let best = null;
  let bestScore = -Infinity;

  for (let attempt = 0; attempt < 40; attempt++) {
    const x = randomBetween(margin, maxX);
    const y = randomBetween(margin, maxY);

    const overlapsYes = !(
      x + noW + NO_YES_GAP < yesRect.left ||
      x - NO_YES_GAP > yesRect.right ||
      y + noH + NO_YES_GAP < yesRect.top ||
      y - NO_YES_GAP > yesRect.bottom
    );

    if (overlapsYes) continue;

    const travel = Math.hypot(x - current.left, y - current.top);
    const edgeComfort = Math.min(x, y, maxX - x, maxY - y);
    const score = travel + edgeComfort * 0.4;

    if (score > bestScore) {
      bestScore = score;
      best = { x, y };
    }
  }

  if (!best) {
    const goLeft = yesRect.left > window.innerWidth / 2;
    best = { x: goLeft ? margin : maxX, y: margin };
  }

  return best;
}

function getNoRect() {
  if (fleeState.active && fleeState.rect) return fleeState.rect;
  const box = noBtn.getBoundingClientRect();
  return { left: box.left, top: box.top, width: box.width, height: box.height };
}

function distanceToRect(x, y, rect) {
  const closestX = clamp(x, rect.left, rect.left + rect.width);
  const closestY = clamp(y, rect.top, rect.top + rect.height);
  return Math.hypot(x - closestX, y - closestY);
}

/** Move "No" away and let "Yes" grow a little. */
function flee() {
  if (hasSaidYes) return;

  const now = Date.now();
  if (now - lastFleeAt < 90) return;
  lastFleeAt = now;

  detachNoButton();

  const spot = findFreeSpot();
  moveNoButtonTo(spot.x, spot.y);

  fleeState.escapeCount++;
  growYesButton();

  if (Math.random() < CONFIG.funnyMessageChance) {
    showFunnyMessage();
  }
}

function growYesButton() {
  const steps = Math.min(fleeState.escapeCount, CONFIG.maxYesGrowth);
  const scale = Math.min(1 + steps * CONFIG.yesGrowthStep, CONFIG.maxYesScale);
  yesBtn.style.setProperty("--yes-scale", scale.toFixed(3));
  yesBtn.classList.add("is-grown");
}

let toastTimer = null;

function showFunnyMessage() {
  const now = Date.now();
  if (now - fleeState.lastMessageAt < CONFIG.funnyMessageCooldown) return;
  fleeState.lastMessageAt = now;

  toastEl.textContent = pick(TEXTS.funnyMessages);
  toastEl.classList.add("is-visible");

  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("is-visible"), 1900);
}

function handlePointerMove(event) {
  if (hasSaidYes) return;

  if (distanceToRect(event.clientX, event.clientY, getNoRect()) < CONFIG.fleeRadius) {
    flee();
  }
}

function initNoButton() {
  document.addEventListener("pointermove", handlePointerMove, { passive: true });
  noBtn.addEventListener("mouseenter", () => flee());

  noBtn.addEventListener("pointerdown", (event) => {
    event.preventDefault();
    flee();
  });

  noBtn.addEventListener("touchstart", (event) => {
    event.preventDefault();
    flee();
  }, { passive: false });

  noBtn.addEventListener("click", (event) => {
    event.preventDefault();
    flee();
  });

  noBtn.addEventListener("focus", () => flee());
}
/* ============================================================
   💚  THE "YES" PATH
   ============================================================ */

function handleYes() {
  if (hasSaidYes) return;
  hasSaidYes = true;

  burstConfetti();
  card.classList.add("is-leaving");

  noBtn.style.transition = "opacity 0.45s ease, transform 0.45s ease";
  noBtn.style.opacity = "0";
  noBtn.style.pointerEvents = "none";
  if (noBtnPlaceholder) noBtnPlaceholder.remove();

  startHeartsScene();

  setTimeout(() => {
    finalMessageEl.classList.add("is-visible");
    finalMessageEl.style.pointerEvents = "auto";
  }, 420);

  setTimeout(() => {
    ambientHeartsEl.style.transition = "opacity 0.9s ease";
    ambientHeartsEl.style.opacity = "0.28";
  }, 320);
}

/* ============================================================
   💖  HEARTS SCENE
   ============================================================ */

function startHeartsScene() {
  if (heartsSceneEl.childElementCount > 0) {
    heartsSceneEl.classList.add("is-active");
    return;
  }

  const fragment = document.createDocumentFragment();

  for (let i = 0; i < CONFIG.sceneHeartCount; i++) {
    const isRising = i % 4 === 3;
    const heart = document.createElement("div");
    heart.className = "falling-heart";

    const size = randomBetween(14, 54);
    const duration = randomBetween(7, 16);
    const delay = randomBetween(0, 12);

    heart.style.width = `${size}px`;
    heart.style.height = `${size * 0.9}px`;
    heart.style.left = `${randomBetween(0, 99)}%`;

    if (isRising) {
      heart.style.top = "auto";
      heart.style.bottom = "-14vh";
      heart.style.animationName = "heartRise";
    }

    heart.style.animationDuration = `${duration}s`;
    heart.style.animationDelay = `-${delay}s`;
    heart.style.setProperty("--heart-duration", `${duration.toFixed(2)}s`);
    heart.style.setProperty("--sway", `${randomBetween(-130, 130)}px`);
    heart.style.setProperty("--spin", `${randomBetween(-300, 300)}deg`);
    heart.style.setProperty("--start-scale", randomBetween(0.5, 0.95).toFixed(2));
    heart.style.setProperty("--heart-opacity", randomBetween(0.5, 0.95).toFixed(2));

    const color = pick(HEART_COLORS);
    heart.innerHTML = heartSVG(color);
    heart.style.filter = `drop-shadow(0 4px 10px ${color}44)`;

    fragment.appendChild(heart);
  }

  heartsSceneEl.appendChild(fragment);
  heartsSceneEl.classList.add("is-active");
}

/* ============================================================
   🎊  CONFETTI
   ============================================================ */

function burstConfetti() {
  const fragment = document.createDocumentFragment();

  for (let i = 0; i < CONFIG.confettiCount; i++) {
    const piece = document.createElement("div");
    piece.className = "confetti-piece";

    const width = randomBetween(5, 9);
    piece.style.width = `${width}px`;
    piece.style.height = `${width * randomBetween(1.4, 2.6)}px`;
    piece.style.left = `${randomBetween(0, 99)}%`;
    piece.style.background = pick(CONFETTI_COLORS);
    piece.style.borderRadius = Math.random() > 0.7 ? "50%" : "1px";
    piece.style.setProperty("--confetti-x", `${randomBetween(-140, 140)}px`);
    piece.style.setProperty("--confetti-rot", `${randomInt(360, 900)}deg`);
    piece.style.animationDuration = `${randomBetween(2.4, 4.4)}s`;
    piece.style.animationDelay = `${randomBetween(0, 0.6)}s`;

    fragment.appendChild(piece);
  }

  confettiLayer.appendChild(fragment);

  setTimeout(() => {
    confettiLayer.innerHTML = "";
  }, 5600);
}

/* ============================================================
   🚀  INIT
   ============================================================ */

function keepNoButtonInViewport() {
  if (!fleeState.active || !fleeState.rect) return;

  const noW = fleeState.rect.width;
  const noH = fleeState.rect.height;
  const x = clamp(fleeState.rect.left, 8, Math.max(8, window.innerWidth - noW - 8));
  const y = clamp(fleeState.rect.top, 8, Math.max(8, window.innerHeight - noH - 8));
  moveNoButtonTo(x, y, false);
}

function init() {
  // ?preview=1 renders a still frame for the link-preview image.
  if (new URLSearchParams(window.location.search).has("preview")) {
    document.body.classList.add("is-preview");
  }

  applyTexts();
  createAmbientHearts();
  initNoButton();

  yesBtn.addEventListener("click", handleYes);
  window.addEventListener("resize", keepNoButtonInViewport);
}

init();
</script>
</body>
</html>
